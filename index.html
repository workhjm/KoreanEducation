<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>지금 몇 시예요? — Time Challenge</title>
<style>
:root{
  --bg:#f7f7fb;
  --card:#ffffff;
  --text:#17181c;
  --muted:#70737c;
  --line:#e5e7ee;
  --accent:#ff6b4a;
  --accent-2:#6c63ff;
  --success:#1f9d66;
  --shadow:0 16px 50px rgba(22,24,35,.10);
  --radius:24px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;color:var(--text);background:linear-gradient(180deg,#fbfbfe 0%,#f2f3f8 100%)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px clamp(16px,2.5vw,28px);gap:14px;flex:0 0 auto
}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.03em}
.brand-badge{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),#ff9e67);color:white;box-shadow:0 8px 20px rgba(255,107,74,.25)
}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.02em;margin-top:2px}
.top-actions{display:flex;gap:8px}
.icon-btn{
  border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;color:#3a3c43;
  box-shadow:0 4px 14px rgba(0,0,0,.04)
}
.main{
  width:min(1200px,100%);margin:0 auto;padding:0 clamp(14px,2.5vw,24px) 14px;
  display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;flex:1;min-height:0;overflow:hidden
}
.stage{
  position:relative;min-height:0;height:100%;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.9);border-radius:32px;box-shadow:var(--shadow);
  overflow:hidden;display:flex;flex-direction:column
}
.stage::before{
  content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 15% 20%,rgba(108,99,255,.08),transparent 28%),
  radial-gradient(circle at 85% 80%,rgba(255,107,74,.09),transparent 24%);
  pointer-events:none
}
.stage-head{position:relative;padding:18px 24px 8px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex:0 0 auto}
.prompt{font-weight:900;font-size:clamp(28px,4vw,48px);letter-spacing:-.05em}
.round{font-weight:800;color:var(--muted);font-size:14px;background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:999px}
.timer-wrap{position:relative;padding:0 24px;flex:0 0 auto}
.timer-line{height:10px;background:#eceef4;border-radius:999px;overflow:hidden}
.timer-fill{height:100%;width:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .08s linear}
.timer-meta{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.timer-text{font-weight:900;font-size:clamp(30px,4vw,54px);letter-spacing:-.04em}
.timer-hint{font-size:15px;color:var(--muted);font-weight:800}
.clock-zone{
  position:relative;flex:1;display:grid;place-items:center;padding:10px 18px 6px;min-height:0;overflow:hidden
}
.clock-card{
  width:min(680px,94%);height:100%;max-height:500px;display:grid;place-items:center;position:relative
}
.digital{
  font-variant-numeric:tabular-nums;
  font-weight:900;font-size:clamp(110px,19vw,220px);letter-spacing:-.08em;line-height:1;
  color:#15161a;text-shadow:0 8px 24px rgba(0,0,0,.06)
}
.analog{
  width:min(430px,56vh,76vw);aspect-ratio:1;border-radius:50%;background:#fff;border:10px solid #18191d;
  position:relative;box-shadow:0 18px 45px rgba(0,0,0,.10), inset 0 0 0 2px #f2f3f7
}
.analog .center{position:absolute;width:20px;height:20px;border-radius:50%;background:#17181c;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:999px;z-index:3}
.hour-hand{width:10px;height:28%;background:#17181c;margin-left:-5px}
.minute-hand{width:7px;height:38%;background:var(--accent);margin-left:-3.5px}
.tick{position:absolute;left:50%;top:50%;width:2px;height:44%;transform-origin:50% 0}
.tick::after{content:"";display:block;width:2px;height:12px;background:#b8bac2;border-radius:999px}
.tick.major::after{height:19px;width:4px;background:#202126}
.num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(18px,2.2vw,26px)}
.answer-panel{
  position:relative;margin:2px 20px 12px;padding:12px 18px;border-radius:18px;background:#f8f9fc;border:1px solid var(--line);
  min-height:66px;display:flex;align-items:center;justify-content:center;text-align:center;flex:0 0 auto
}
.answer-text{font-size:clamp(24px,3.2vw,38px);font-weight:900;line-height:1.45;letter-spacing:-.03em}
.answer-hidden{color:var(--muted);font-weight:800}
.action-row{
  position:relative;display:flex;gap:8px;justify-content:center;padding:0 20px 16px;flex-wrap:wrap;flex:0 0 auto
}
.primary{
  border:0;border-radius:16px;padding:13px 20px;font-weight:900;font-size:16px;color:#fff;
  background:linear-gradient(135deg,var(--accent),#ff895e);box-shadow:0 10px 24px rgba(255,107,74,.28)
}
.secondary{
  border:1px solid var(--line);border-radius:16px;padding:12px 17px;font-weight:900;font-size:15px;background:#fff;color:#26272c
}
.panel{
  background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.94);
  border-radius:24px;box-shadow:var(--shadow);padding:16px 18px;height:100%;min-height:0;overflow:auto;position:relative
}
.panel h2{margin:0 0 4px;font-size:19px;letter-spacing:-.04em}
.panel .desc{margin:0 0 10px;color:var(--muted);font-size:12px;line-height:1.4}
.group{padding:10px 0;border-top:1px solid var(--line)}
.group:first-of-type{border-top:0;padding-top:4px}
.label{font-size:13px;font-weight:900;margin-bottom:9px;color:#4d5058}
.segment{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.segment.two{grid-template-columns:repeat(2,1fr)}
.segment.four{grid-template-columns:repeat(4,1fr)}
.seg-btn{
  border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 6px;font-size:12px;font-weight:800;color:#555861
}
.seg-btn.active{background:#23252b;color:#fff;border-color:#23252b}
.row{display:flex;gap:8px;align-items:center}
select,input[type=number]{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 10px;font-weight:800;color:#333
}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{position:relative;width:48px;height:28px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#d8dbe4;border-radius:999px;transition:.2s}
.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.14);transition:.2s}
.switch input:checked + .slider{background:var(--accent-2)}
.switch input:checked + .slider:before{transform:translateX(20px)}
.small{font-size:12px;color:var(--muted);line-height:1.45}
kbd{background:#f0f1f5;border:1px solid #d8dae2;border-bottom-width:2px;border-radius:6px;padding:2px 6px;font-size:11px}
.flash{animation:flash .26s ease}
@keyframes flash{0%{transform:scale(.98);opacity:.65}100%{transform:scale(1);opacity:1}}
.timeup .timer-text{color:var(--accent)}
.timeup .clock-card{animation:shake .25s linear 2}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media (max-width:900px){
  html,body{overflow:auto}
  .app{height:auto;min-height:100vh;overflow:visible}
  .main{grid-template-columns:1fr;overflow:visible;padding-bottom:18px}
  .panel{position:relative;height:auto;overflow:visible}
  .stage{min-height:620px;height:auto}
}
@media (max-width:560px){
  .topbar{padding:14px 14px}
  .brand small{display:none}
  .main{padding:0 10px 18px}
  .stage,.panel{border-radius:22px}
  .stage-head{padding:20px 18px 8px}
  .timer-wrap{padding:0 18px}
  .answer-panel{margin:4px 14px 16px}
  .action-row{padding:0 14px 20px}
  .panel{padding:18px}
  .digital{font-size:clamp(82px,26vw,150px)}
}
.fullscreen .panel,.fullscreen .topbar{display:none}
.fullscreen .main{display:block;width:100%;padding:0}
.fullscreen .stage{min-height:100vh;border-radius:0;box-shadow:none}

@media (min-width:901px) and (max-height:760px){
  .topbar{padding-top:8px;padding-bottom:8px}
  .brand-badge{width:36px;height:36px;border-radius:12px}
  .prompt{font-size:clamp(24px,3vw,38px)}
  .timer-text{font-size:clamp(26px,3.2vw,42px)}
  .clock-zone{padding-top:4px;padding-bottom:2px}
  .analog{width:min(280px,42vh,62vw)}
  .digital{font-size:clamp(82px,14vw,150px)}
  .answer-panel{min-height:56px;padding:8px 14px;margin-bottom:8px}
  .answer-text{font-size:clamp(20px,2.6vw,30px)}
  .action-row{padding-bottom:10px}
  .group{padding:7px 0}
  .panel{padding-top:12px;padding-bottom:12px}
}


.settings-toggle{
  position:absolute;right:14px;top:14px;z-index:20;
  border:1px solid var(--line);background:#fff;color:#333;
  border-radius:14px;padding:10px 12px;font-weight:900;
  box-shadow:0 6px 18px rgba(0,0,0,.08)
}
.main{position:relative}
.main.panel-collapsed{grid-template-columns:minmax(0,1fr);gap:0}
.main.panel-collapsed .panel{display:none}
.main.panel-collapsed .clock-card{width:min(820px,96%);max-height:560px}
.main.panel-collapsed .analog{width:min(500px,62vh,82vw)}
.main.panel-collapsed .digital{font-size:clamp(130px,22vw,270px)}
@media (max-width:900px){
  .settings-toggle{position:fixed;right:14px;top:72px}
}

</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-badge">⏰</div>
      <div>지금 몇 시예요?<small>TIME CHALLENGE · 초급 한국어 시간 읽기</small></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="soundBtn" title="효과음">🔊</button>
      <button class="icon-btn" id="fullscreenBtn" title="전체화면">⛶</button>
    </div>
  </div>

  <main class="main">
    <button class="settings-toggle" id="settingsToggle" aria-expanded="true">⚙ 설정 접기</button>
    <section class="stage" id="stage">
      <div class="stage-head">
        <div class="prompt">빨리 읽어 주세요!</div>
        <div class="round" id="roundLabel">문제 1</div>
      </div>

      <div class="timer-wrap">
        <div class="timer-line"><div class="timer-fill" id="timerFill"></div></div>
        <div class="timer-meta">
          <div class="timer-text" id="timerText">5.0</div>
          <div class="timer-hint" id="timerHint">제한 시간</div>
        </div>
      </div>

      <div class="clock-zone">
        <div class="clock-card" id="clockCard"></div>
      </div>

      <div class="answer-panel">
        <div id="answerBox" class="answer-hidden">정답을 확인해 보세요.</div>
      </div>

      <div class="action-row">
        <button class="primary" id="nextBtn">다음 시간 ▶</button>
        <button class="secondary" id="answerBtn">정답 보기</button>
        <button class="secondary" id="restartBtn">↻ 다시 시작</button>
      </div>
    </section>

    <aside class="panel">
      <h2>수업 설정</h2>
      <p class="desc">설정은 문제를 바꿀 때 바로 적용됩니다.</p>

      <div class="group">
        <div class="label">시계 표시</div>
        <div class="segment" id="modeSegment">
          <button class="seg-btn" data-mode="analog">아날로그</button>
          <button class="seg-btn active" data-mode="digital">디지털</button>
          <button class="seg-btn" data-mode="random">랜덤</button>
        </div>
      </div>

      <div class="group">
        <div class="label">아날로그 시계 난이도</div>
        <div class="segment two" id="analogLevelSegment">
          <button class="seg-btn active" data-level="easy">쉬움 · 1–12</button>
          <button class="seg-btn" data-level="hard">어려움 · 12·3·6·9</button>
        </div>
      </div>

      <div class="group">
        <div class="label">제한 시간</div>
        <div class="segment four" id="timerSegment">
          <button class="seg-btn" data-time="3">3초</button>
          <button class="seg-btn" data-time="5">5초</button>
          <button class="seg-btn" data-time="10">10초</button>
          <button class="seg-btn active" data-time="0">없음</button>
        </div>
      </div>

      <div class="group">
        <div class="label">분 생성 간격</div>
        <select id="minuteStep">
          <option value="1">모든 분 (1분 단위)</option>
          <option value="5" selected>5분 단위</option>
          <option value="10">10분 단위</option>
          <option value="15">15분 단위</option>
          <option value="30">30분 단위</option>
          <option value="60">정각만</option>
        </select>
      </div>

      <div class="group">
        <div class="label">시간 범위</div>
        <div class="row">
          <select id="hourMin"></select>
          <span style="font-weight:900">~</span>
          <select id="hourMax"></select>
        </div>
      </div>

      <div class="group">
        <div class="switch-row">
          <div>
            <div class="label" style="margin:0 0 3px">자동 다음 문제</div>
            <div class="small">타이머 종료 후 자동으로 다음 시간을 표시합니다.</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="autoNext">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="group">
        <div class="switch-row">
          <div>
            <div class="label" style="margin:0 0 3px">정답 자동 표시</div>
            <div class="small">시간 종료 후 정답을 보여 줍니다.</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="autoAnswer">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="group">
        <div class="small">
          단축키: <kbd>Space</kbd> 다음 문제 · <kbd>A</kbd> 정답 · <kbd>F</kbd> 전체화면
        </div>
      </div>
    </aside>
  </main>
</div>

<script>
const $ = (s)=>document.querySelector(s);
const $$ = (s)=>[...document.querySelectorAll(s)];

const state = {
  mode:'digital',
  timer:0,
  sound:true,
  hour:7,
  minute:30,
  round:1,
  interval:null,
  autoTimeout:null,
  tickInterval:null,
  tickFlip:false,
  startedAt:0,
  running:false,
  answerShown:false,
  displayMode:'digital',
  analogLevel:'easy'
};

const koreanHours = ['열두','한','두','세','네','다섯','여섯','일곱','여덟','아홉','열','열한'];
const ones = ['', '일','이','삼','사','오','육','칠','팔','구'];
const tens = ['', '십','이십','삼십','사십','오십'];

function sino(n){
  if(n===0) return '영';
  const t=Math.floor(n/10), o=n%10;
  return `${tens[t]}${ones[o]}`;
}

function formatAnswer(h,m){
  const hWord = koreanHours[h%12];
  if(m===0) return `${hWord} 시예요.`;
  if(m===30) return `${hWord} 시 삼십 분이에요.<br><span style="color:var(--accent-2)">${hWord} 시 반이에요.</span>`;
  return `${hWord} 시 ${sino(m)} 분이에요.`;
}

function setupHours(){
  const min=$('#hourMin'), max=$('#hourMax');
  for(let h=1; h<=12; h++){
    const a=document.createElement('option'); a.value=h; a.textContent=`${h}시`; min.appendChild(a);
    const b=document.createElement('option'); b.value=h; b.textContent=`${h}시`; max.appendChild(b);
  }
  min.value='1'; max.value='12';
}

function getRandomTime(){
  let minH=+$('#hourMin').value, maxH=+$('#hourMax').value;
  if(minH>maxH){ [minH,maxH]=[maxH,minH]; }
  const hour = Math.floor(Math.random()*(maxH-minH+1))+minH;
  const step=+$('#minuteStep').value;
  let minute=0;
  if(step<60){
    const count=Math.floor(60/step);
    minute=Math.floor(Math.random()*count)*step;
  }
  return {hour,minute};
}

function chooseDisplayMode(){
  if(state.mode==='random') return Math.random()<.5?'analog':'digital';
  return state.mode;
}

function renderClock(){
  const card=$('#clockCard');
  card.innerHTML='';
  card.classList.remove('flash');
  void card.offsetWidth;
  card.classList.add('flash');

  state.displayMode=chooseDisplayMode();
  if(state.displayMode==='digital'){
    const d=document.createElement('div');
    d.className='digital';
    d.textContent=`${String(state.hour).padStart(2,'0')}:${String(state.minute).padStart(2,'0')}`;
    card.appendChild(d);
  } else {
    const clock=document.createElement('div');
    clock.className='analog';

    for(let i=0;i<60;i++){
      const tick=document.createElement('div');
      tick.className='tick'+(i%5===0?' major':'');
      tick.style.transform=`translate(-50%,-50%) rotate(${i*6}deg)`;
      clock.appendChild(tick);
    }
    const numeralSets = {
      easy: [
        {n:12,a:-90},{n:1,a:-60},{n:2,a:-30},{n:3,a:0},
        {n:4,a:30},{n:5,a:60},{n:6,a:90},{n:7,a:120},
        {n:8,a:150},{n:9,a:180},{n:10,a:210},{n:11,a:240}
      ],
      hard: [
        {n:12,a:-90},{n:3,a:0},{n:6,a:90},{n:9,a:180}
      ]
    };
    numeralSets[state.analogLevel].forEach(({n,a})=>{
      const r = 39;
      const rad = a * Math.PI / 180;
      const x = 50 + Math.cos(rad) * r;
      const y = 50 + Math.sin(rad) * r;
      const el=document.createElement('div');
      el.className='num';
      el.textContent=n;
      el.style.left=`${x}%`;
      el.style.top=`${y}%`;
      clock.appendChild(el);
    });

    const hourHand=document.createElement('div');
    hourHand.className='hand hour-hand';
    hourHand.style.transform=`rotate(${(state.hour%12)*30 + state.minute*.5}deg)`;
    const minuteHand=document.createElement('div');
    minuteHand.className='hand minute-hand';
    minuteHand.style.transform=`rotate(${state.minute*6}deg)`;
    const center=document.createElement('div');
    center.className='center';

    clock.append(hourHand,minuteHand,center);
    card.appendChild(clock);
  }
}

function setAnswer(show){
  state.answerShown=show;
  const box=$('#answerBox');
  if(show){
    box.className='answer-text';
    box.innerHTML=formatAnswer(state.hour,state.minute);
    $('#answerBtn').textContent='정답 숨기기';
  } else {
    box.className='answer-hidden';
    box.textContent='정답을 확인해 보세요.';
    $('#answerBtn').textContent='정답 보기';
  }
}

function beep(freq=880,duration=.12){
  if(!state.sound) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.frequency.value=freq; osc.type='sine';
    gain.gain.setValueAtTime(.0001,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.01);
    gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+duration+.02);
  }catch(e){}
}

function tickSound(){
  if(!state.sound || state.timer===0) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type='square';
    osc.frequency.value=state.tickFlip ? 980 : 760;
    state.tickFlip=!state.tickFlip;
    gain.gain.setValueAtTime(.0001,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.028,ctx.currentTime+.003);
    gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.045);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+.055);
  }catch(e){}
}
function startTicking(){
  stopTicking();
  if(state.timer===0 || !state.sound) return;
  tickSound();
  state.tickInterval=setInterval(tickSound,1000);
}
function stopTicking(){
  clearInterval(state.tickInterval);
  state.tickInterval=null;
}


function clearTimers(){
  clearInterval(state.interval); state.interval=null;
  clearTimeout(state.autoTimeout); state.autoTimeout=null;
  stopTicking();
}

function startTimer(){
  clearTimers();
  const total=state.timer;
  const stage=$('#stage');
  stage.classList.remove('timeup');

  if(total===0){
    $('#timerText').textContent='∞';
    $('#timerFill').style.width='100%';
    $('#timerHint').textContent='제한 시간 없음';
    state.running=false;
    return;
  }

  state.running=true;
  state.startedAt=performance.now();
  startTicking();
  $('#timerHint').textContent='제한 시간';
  $('#timerText').textContent=total.toFixed(1);
  $('#timerFill').style.width='100%';

  state.interval=setInterval(()=>{
    const elapsed=(performance.now()-state.startedAt)/1000;
    const remain=Math.max(0,total-elapsed);
    $('#timerText').textContent=remain.toFixed(1);
    $('#timerFill').style.width=`${(remain/total)*100}%`;

    if(remain<=0){
      clearInterval(state.interval);
      state.interval=null;
      state.running=false;
      stopTicking();
      stage.classList.add('timeup');
      $('#timerText').textContent='0.0';
      $('#timerFill').style.width='0%';
      beep(660,.18);
      setTimeout(()=>beep(520,.18),120);

      if($('#autoAnswer').checked) setAnswer(true);

      if($('#autoNext').checked){
        state.autoTimeout=setTimeout(nextQuestion, $('#autoAnswer').checked ? 1800 : 900);
      }
    }
  },70);
}

function nextQuestion(){
  clearTimers();
  const {hour,minute}=getRandomTime();
  state.hour=hour; state.minute=minute;
  setAnswer(false);
  renderClock();
  $('#roundLabel').textContent=`문제 ${state.round++}`;
  $('#stage').classList.remove('timeup');
  startTimer();
  beep(980,.08);
}

function restart(){
  state.round=1;
  nextQuestion();
}

function toggleFullscreen(){
  const app=$('#app');
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen?.();
    app.classList.add('fullscreen');
  }else{
    document.exitFullscreen?.();
    app.classList.remove('fullscreen');
  }
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement) $('#app').classList.remove('fullscreen');
});

$$('#modeSegment .seg-btn').forEach(btn=>btn.addEventListener('click',()=>{
  $$('#modeSegment .seg-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); state.mode=btn.dataset.mode; nextQuestion();
}));

$$('#analogLevelSegment .seg-btn').forEach(btn=>btn.addEventListener('click',()=>{
  $$('#analogLevelSegment .seg-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.analogLevel=btn.dataset.level;
  if(state.displayMode==='analog' || state.mode==='analog') renderClock();
}));

$$('#timerSegment .seg-btn').forEach(btn=>btn.addEventListener('click',()=>{
  $$('#timerSegment .seg-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); state.timer=+btn.dataset.time; startTimer();
}));

$('#nextBtn').addEventListener('click',nextQuestion);
$('#restartBtn').addEventListener('click',restart);
$('#answerBtn').addEventListener('click',()=>setAnswer(!state.answerShown));
$('#soundBtn').addEventListener('click',()=>{
  state.sound=!state.sound;
  $('#soundBtn').textContent=state.sound?'🔊':'🔇';
  if(state.sound){
    beep(880,.08);
    if(state.running && state.timer>0) startTicking();
  }else{
    stopTicking();
  }
});
$('#fullscreenBtn').addEventListener('click',toggleFullscreen);

$('#hourMin').addEventListener('change',nextQuestion);
$('#hourMax').addEventListener('change',nextQuestion);
$('#minuteStep').addEventListener('change',nextQuestion);

document.addEventListener('keydown',(e)=>{
  if(e.code==='Space'){e.preventDefault();nextQuestion();}
  if(e.key.toLowerCase()==='a') setAnswer(!state.answerShown);
  if(e.key.toLowerCase()==='f') toggleFullscreen();
});


const settingsToggle=$('#settingsToggle');
settingsToggle.addEventListener('click',()=>{
  const main=$('.main');
  const collapsed=main.classList.toggle('panel-collapsed');
  settingsToggle.textContent=collapsed?'⚙ 설정 열기':'⚙ 설정 접기';
  settingsToggle.setAttribute('aria-expanded',String(!collapsed));
});

setupHours();
nextQuestion();
</script>
</body>
</html>
